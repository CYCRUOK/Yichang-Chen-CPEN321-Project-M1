# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.
#
# M1 has no database, so only the backend runs here. (The course template's
# MongoDB service will come back when the project needs persistence.)

name: cpen321-project

services:
  backend:
    restart: unless-stopped
    build: ./backend
    # Published on all interfaces so a physical Android device on the same Wi-Fi
    # can reach it. Emulators use http://10.0.2.2:3000/api/ either way.
    # On the cloud VM, nginx terminates TLS on 443 and proxies to this port.
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
